# CI-360 — HTTPS → conteneur ci360-app (127.0.0.1:3022). Écoute sur l'IP : un *:443 perdrait face aux vhosts Virtualmin.
<VirtualHost 185.230.64.211:443 [2a02:4780:c:ccff::1]:443>
    ServerName ci360.yira.pro
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ci360.yira.pro/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ci360.yira.pro/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader unset X-Forwarded-Host early
    # Réponses IA diffusées en continu : pas de mise en tampon, délai large.
    ProxyTimeout 300
    ProxyPass / http://127.0.0.1:3022/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:3022/
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    ErrorLog ${APACHE_LOG_DIR}/ci360.yira.pro-error.log
    CustomLog ${APACHE_LOG_DIR}/ci360.yira.pro-access.log combined
</VirtualHost>
