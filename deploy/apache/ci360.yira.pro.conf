# CI-360 — HTTP : tout vers https://ci360.yira.pro (le défi Let's Encrypt passe).
<VirtualHost *:80>
    ServerName ci360.yira.pro
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://ci360.yira.pro%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/ci360.yira.pro-error.log
    CustomLog ${APACHE_LOG_DIR}/ci360.yira.pro-access.log combined
</VirtualHost>
